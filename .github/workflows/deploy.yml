name: Deploy WealthPilot to GitHub Pages

on:
  push:
    branches: [main, demo]
  workflow_dispatch:
    inputs:
      root_version:
        description: Root website version
        type: choice
        options: [main, demo]
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-from-demo:
    if: github.ref == 'refs/heads/demo'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Request deployment from the permitted main branch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: { root_version: context.payload.inputs?.root_version || 'main' }
            });
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout root website
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.root_version || 'main' }}
      - name: Checkout customer demo
        uses: actions/checkout@v4
        with:
          ref: demo
          path: customer-demo
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            wealthpilot/package-lock.json
            customer-demo/wealthpilot/package-lock.json
      - name: Install root dependencies
        working-directory: wealthpilot
        run: npm ci
      - name: Validate root
        working-directory: wealthpilot
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Install demo dependencies
        working-directory: customer-demo/wealthpilot
        run: npm ci
      - name: Validate demo
        working-directory: customer-demo/wealthpilot
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build root
        working-directory: wealthpilot
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_ROUTER_MODE: hash
          VITE_DATA_MODE: ${{ inputs.root_version == 'demo' && 'demo' || 'api' }}
          VITE_API_BASE_URL: https://montra-apis-w8pd.onrender.com/api/v1
        run: npm run build
      - name: Build customer demo
        working-directory: customer-demo/wealthpilot
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/demo/
          VITE_ROUTER_MODE: hash
          VITE_DATA_MODE: demo
        run: npm run build
      - name: Combine websites
        run: |
          mkdir -p wealthpilot/dist/demo
          cp -a customer-demo/wealthpilot/dist/. wealthpilot/dist/demo/
          touch wealthpilot/dist/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wealthpilot/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
