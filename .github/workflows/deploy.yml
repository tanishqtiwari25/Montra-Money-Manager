name: Deploy WealthPilot to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wealthpilot/package-lock.json

      - name: Install dependencies
        working-directory: wealthpilot
        run: npm ci

      - name: Validate
        working-directory: wealthpilot
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build
        working-directory: wealthpilot
        env:
          VITE_BASE_PATH: /Montra-Money-Manager/
          VITE_ROUTER_MODE: hash
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wealthpilot/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
